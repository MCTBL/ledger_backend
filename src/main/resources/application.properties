spring.application.name=ledger

server.port=9090

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:3306/ledger_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
app.jwt.secret=${JWT_SECRET:temptemptemptemptemptemptemptemptemptemptemp}

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.mctbl.ledger.bean
mybatis.configuration.map-underscore-to-camel-case=true
#logging.level.org.springframework.web=debug
spring.jackson.time-zone=GMT+8
app.jwt.expiration=86400000